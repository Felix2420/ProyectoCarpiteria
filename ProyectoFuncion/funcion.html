<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación 3D: Superficie Multimodal Dinámica</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        canvas { display: block; }
        
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            max-width: 350px;
            pointer-events: none; /* No interfiere con el mouse */
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.5s;
        }

        h1 { margin: 0 0 10px 0; font-size: 1.5em; color: #00ffff; text-transform: uppercase; letter-spacing: 2px; }
        p { margin: 0 0 8px 0; font-size: 0.9em; color: #ccc; line-height: 1.4; }
        .highlight { color: #fff; font-weight: bold; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>Visualización Dinámica</h1>
    <p>Superficie de alto relieve con <span class="highlight">múltiples mínimos y máximos locales</span>.</p>
    <p>Función: <span class="highlight">f(x, y, t)</span> modulada por tiempo y frecuencia compleja.</p>
    <p style="font-size: 0.8em; color: #888; margin-top: 15px;">Arrastra para rotar | Scroll para zoom</p>
</div>

<!-- Importmap para Three.js -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- CONFIGURACIÓN GLOBAL ---
    let scene, camera, renderer, controls, mesh, points;
    let mainLight, rectLight;
    
    // Parámetros de la superficie
    const GRID_SIZE = 25;
    const SEGMENTS = 120; // Alta resolución

    init();
    animate();

    function init() {
        // 1. Escena y Niebla (para profundidad)
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.025);

        // 2. Cámara
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 20); // Posición inicial épica

        // 3. Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Habilitar sombras suaves
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // 4. Controles (con Damping para suavidad)
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 60;
        // Auto-rotación para la presentación
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5; // Muy suave

        // 5. Luces Dinámicas
        scene.add(new THREE.AmbientLight(0x111122)); // Luz ambiental muy oscura

        // Luz principal movil (crea sombras)
        mainLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        // Configurar resolución de sombra
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        // Luz de acento azul cian desde abajo
        const pointLight = new THREE.PointLight(0x00ffff, 15, 50);
        pointLight.position.set(0, -5, 0);
        scene.add(pointLight);

        // 6. Geometría y Materiales
        const geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, SEGMENTS, SEGMENTS);
        geometry.rotateX(-Math.PI / 2); // Orientación horizontal

        // Material de la superficie (reacciona a luz y sombras)
        const material = new THREE.MeshPhongMaterial({
            color: 0x111111, // Base casi negra
            emissive: 0x001122, // Ligero brillo azul oscuro
            specular: 0x555555, // Brillo reflejo
            shininess: 30,
            wireframe: true, // Mantener wireframe pero elegante
            transparent: true,
            opacity: 0.8,
            // flatShading: true // Descomenta si prefieres un look low-poly
        });

        mesh = new THREE.Mesh(geometry, material);
        mesh.receiveShadow = true;
        mesh.castShadow = true;
        scene.add(mesh);

        // AÑADIR PUNTOS EN LOS VÉRTICES (Efecto tecnológico)
        const pointsMaterial = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.04,
            transparent: true,
            opacity: 0.6,
            sizeAttenuation: true
        });
        points = new THREE.Points(geometry, pointsMaterial);
        scene.add(points);

        // 7. Eventos
        window.addEventListener('resize', onWindowResize);
    }

    // --- FUNCIÓN MATEMÁTICA Y ACTUALIZACIÓN ---
    function updateSurface(time) {
        const positions = mesh.geometry.attributes.position.array;
        
        for (let i = 0; i < positions.length; i += 3) {
            let x = positions[i];
            let z = positions[i + 2];

            // Normalizar x, y al rango [-1, 1] para cálculos más estables
            let nx = x / (GRID_SIZE / 2);
            let nz = z / (GRID_SIZE / 2);
            
            let d = Math.sqrt(nx*nx + nz*nz); // Distancia al centro

            // COMPOSICIÓN DE LA FUNCIÓN ANIMADA
            // 1. Base multimodal (estilo cartón de huevos)
            let base = Math.sin(nx * 8 + time * 0.5) * Math.cos(nz * 8 - time * 0.5);
            
            // 2. Ondas radiales expansivas
            let radial = Math.sin(d * 12 - time * 1.5) * 0.5;
            
            // 3. Atenuación en los bordes para que parezca una isla de datos
            let attenuation = Math.cos(Math.min(d, 1) * Math.PI / 2);

            // Resultado final (Altura Y)
            let h = (base + radial) * 2.5 * attenuation;
            
            // Suavizar el centro para que no haya un pico infinito
            positions[i + 1] = h;
        }
        
        // Indicar a Three.js que los vértices han cambiado
        mesh.geometry.attributes.position.needsUpdate = true;
    }

    // --- CICLO DE RENDERIZADO ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Escalar tiempo para velocidad de animación
        const time = performance.now() * 0.001;
        
        // 1. Actualizar geometría
        updateSurface(time);
        
        // 2. Mover la luz principal para sombras dinámicas
        mainLight.position.x = Math.sin(time * 0.3) * 15;
        mainLight.position.z = Math.cos(time * 0.3) * 15;
        
        // 3. Actualizar controles e inclinación leve automática del mesh
        controls.update(); // Maneja autoRotate
        mesh.rotation.y = Math.sin(time * 0.1) * 0.02; // Leve balanceo extra

        // 4. Renderizar escena
        renderer.render(scene, camera);
    }

    // --- AJUSTE DE VENTANA ---
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
</script>

</body>
</html>
